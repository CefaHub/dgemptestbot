services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: empire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: empire
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empire"]
      interval: 5s
      timeout: 5s
      retries: 10
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      DATABASE_URL: postgresql+asyncpg://empire:${POSTGRES_PASSWORD}@database:5432/empire
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres_data:
