name: Review standardized photo-card designs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-standardized-card-designs.yml'
      - 'data/catalog.json'
      - 'assets/cards/**'
      - 'tools/card_design_contact_sheet.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install -r requirements.txt
      - name: Create visual audit contact sheet of ALL issued photo cards
        run: python -m tools.card_design_contact_sheet
      - name: Commit full card QA overview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/previews/design_audit/ALL_RELEASED_CARD_DESIGNS.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Review all 52 standardized real-photo card designs together'
            git push origin HEAD:main
          fi
