name: Preview real-photo research sets (never publish)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/research/lesserafim_aura_rare_v2_candidates.json'
      - 'tools/research/preview_photo_candidate.py'
      - '.github/workflows/photo-research-preview.yml'
permissions:
  contents: read
concurrency:
  group: photo-research-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: python -m pip install Pillow pytest
      - name: Detect obsolete already-published research candidates
        id: status
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          candidate = json.loads(
              Path('tools/research/lesserafim_aura_rare_v2_candidates.json').read_text(encoding='utf-8')
          )
          ids = {
              item['set_id']
              for item in json.loads(
                  Path('assets/collections/verified_sets.json').read_text(encoding='utf-8')
              )['sets']
          }
          pending = candidate.get('set_id') not in ids
          if not pending:
              print('This LE SSERAFIM set is already published. Not reusing the original frames.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"preview={'true' if pending else 'false'}\n")
          PY
      - name: Produce research previews and audit image sources
        if: steps.status.outputs.preview == 'true'
        run: |
          python tools/research/preview_photo_candidate.py \
            --candidate tools/research/lesserafim_aura_rare_v2_candidates.json \
            --output output/research_preview/lesserafim_aura_rare
      - name: Upload contact sheet and quality report, never publish
        if: steps.status.outputs.preview == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DolceEmpire-LE_SSERAFIM-AURA-RARE-RESEARCH_ONLY
          path: output/research_preview/lesserafim_aura_rare/
          if-no-files-found: warn
          retention-days: 14
