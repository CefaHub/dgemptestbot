name: Make DOLCE real photo cards
on:
  workflow_dispatch:
  push:
    branches:
      - feature/real-photo-cards
    paths:
      - 'tools/build_real_photocards.py'
      - 'tools/photo_sources.json'
      - '.github/workflows/dolce-photo-cards.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: python -m pip install 'Pillow>=10,<13'
      - name: Check renderer syntax
        run: python -m py_compile tools/build_real_photocards.py
      - name: Fetch original photos and render collectible cards
        run: python tools/build_real_photocards.py
      - name: Upload finished images with credits
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DolceEmpire-RealPhotos-8cards-2banners
          path: output/DolceEmpire_REAL_PHOTOS_8_CARDS_2_BANNERS.zip
          retention-days: 14
          if-no-files-found: error
