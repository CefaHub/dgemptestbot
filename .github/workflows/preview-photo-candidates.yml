name: Preview real photo-card candidates (no catalog changes)
on:
  push:
    branches: [main]
    paths:
      - 'tools/research/*_candidates.json'
      - 'tools/photo_candidate_previews.py'
      - 'tools/preview_ci.py'
      - 'tests/test_photo_candidate_previews.py'
      - 'tests/test_preview_ci.py'
      - '.github/workflows/preview-photo-candidates.yml'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Optional unpublished candidate JSON path'
        required: false
        type: string
permissions:
  contents: read
jobs:
  preview-real-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow, game dependencies and test tools
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Restore previously downloaded real-photo source bytes (no AI)
        uses: actions/cache@v4
        with:
          path: output/photo_source_cache/
          key: verified-photo-source-v1-${{ github.run_id }}
          restore-keys: |
            verified-photo-source-v1-
      - name: Run full regression suite including no-incomplete-publishing tests
        run: python -m pytest -q
      - name: Preview only changed unpublished sourced collections
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          REVIEW_MANIFEST: ${{ inputs.manifest }}
        run: |
          if [ -n "$REVIEW_MANIFEST" ]; then
            python -m tools.preview_ci --manifest "$REVIEW_MANIFEST"
          else
            python -m tools.preview_ci
          fi
      - name: Upload previews only if created; never publish to game
        uses: actions/upload-artifact@v4
        with:
          name: Dolce-Photo-Candidate-Review
          path: output/photo_candidate_previews/
          if-no-files-found: ignore
          retention-days: 14
