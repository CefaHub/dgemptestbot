name: Publish reviewed IVE EPIC six-photo full collection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-pinned-ive-epic-photos.yml'
      - 'tools/publish_pinned_ive_epic_photo_set.py'
permissions:
  contents: write
concurrency:
  group: pinned-ive-epic-complete-photo-release
  cancel-in-progress: false
jobs:
  publish-six-real-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and test tools
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Test existing catalog and unique photos
        run: python -m pytest -q
      - name: Publish ALL SIX verified photo PNGs, references and 16:9 banner
        run: python -m tools.publish_pinned_ive_epic_photo_set
      - name: Check extended catalog, master design consistency and photo licenses
        run: |
          python -m pytest -q
          python tools/photo_production.py validate
          python tools/generate_gallery.py --check
      - name: Commit entire issued photo collection as one atomic update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json dolce_empire/_catalog.json assets/cards/ive assets/banners/ive assets/collections/verified_sets.json assets/collections/card_design_v1.json assets/PHOTO_CREDITS_NEW_RELEASES.md tools/photo_releases.json tools/photo_sources.json GALLERY.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete IVE SPOTLIGHT EPIC six-real-photo set in uniform master design'
            git push origin HEAD:main
          fi
