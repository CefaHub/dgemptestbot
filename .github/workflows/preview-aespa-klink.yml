name: Preview real aespa K-Link photo cards
on:
  push:
    branches: [feature/aespa-klink-rare-photo-set]
    paths:
      - 'tools/photo_releases.json'
      - 'tools/photo_release_pipeline.py'
      - '.github/workflows/preview-aespa-klink.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=12,<13'
      - name: Crop four distinct sourced photographs and compose a group banner
        run: python tools/photo_release_pipeline.py build --manifest tools/photo_releases.json
      - name: Validate dimensions and source credits
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          folder=Path("output/photo_release_batch")
          data=json.loads((folder/"release_metadata.json").read_text())
          assert len(data["cards"]) == 4
          assert len(data["sets"]) == 1
          for card in data["cards"]:
              with Image.open(folder / card["image_path"]) as photo:
                  assert photo.size == (900,1200)
          with Image.open(folder / data["sets"][0]["banner_path"]) as image:
              assert image.size == (1600,900)
          assert (folder/"PHOTO_CREDITS_NEW_RELEASES.md").exists()
          PY
      - name: Save actual image previews
        uses: actions/upload-artifact@v4
        with:
          name: aespa-KLink-AURA-4-real-photos-and-banner
          path: output/photo_release_batch
          if-no-files-found: error
          retention-days: 14
