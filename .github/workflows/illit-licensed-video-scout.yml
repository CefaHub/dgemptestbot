name: Research licensed ILLIT full-HD real-photo video
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/illit-licensed-video-scout.yml'
permissions:
  contents: write
jobs:
  inspect-licensed-footage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real video sampler and Pillow
        run: |
          python -m pip install 'yt-dlp[default]' Pillow
          ffmpeg -version | head -1
      - name: Sample source movie if available (never generate idol faces)
        run: python -m tools.research.illit_photo_video_source_audit
      - name: Commit visual review and status only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/previews/illit_aura_rare_video_research
          if ! git diff --cached --quiet; then
            git commit -m 'Research license-verified ILLIT 2024 footage for possible unique solo sources'
            git push origin HEAD:main
          fi
