name: Release verified LE SSERAFIM MYTHIC 5 real-photo cards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-pinned-mythic-photos.yml'
permissions:
  contents: write
jobs:
  promote-pinned-real-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies and tests
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Validate baseline full-group photo catalog
        run: python -m pytest -q
      - name: Promote five pinned real-photo PNGs and create complete banner
        run: python -m tools.publish_pinned_mythic_photo_set
      - name: Test newly published full set, uniqueness and credits
        run: |
          python -m pytest -q
          python tools/photo_production.py validate
          python tools/generate_gallery.py --check
      - name: Commit actual 5 playable cards and source metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json dolce_empire/_catalog.json tools/photo_releases.json tools/photo_sources.json assets/collections/verified_sets.json assets/cards/lesserafim assets/banners/lesserafim assets/PHOTO_CREDITS_NEW_RELEASES.md GALLERY.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete LE SSERAFIM ROYAL HAZE MYTHIC verified five-photo collection'
            git push origin HEAD:main
          fi
