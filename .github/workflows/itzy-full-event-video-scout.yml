name: ITZY 5-member original video scout (NO cards)
on:
  push:
    branches: [main]
    paths:
      - 'tools/research/full_lineup_video_scout.py'
      - 'tools/research/itzy_2019_dispatch_full_event_video_scout.json'
      - '.github/workflows/itzy-full-event-video-scout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-footage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow / confirm FFmpeg available
        run: |
          python -m pip install 'Pillow>=10,<13'
          ffmpeg -version | head -1
      - name: Extract timecoded frames from entire CC-licensed ITZY source (NO portraits selected)
        env:
          PYTHONPATH: .
        run: |
          python tools/research/full_lineup_video_scout.py \
            tools/research/itzy_2019_dispatch_full_event_video_scout.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/full_lineup_video_scout/SCOUT_REPORT.json').read_text())
          assert report['cards_created'] == 0, 'Source scout must NEVER issue cards'
          assert report['catalog_updated'] is False
          assert report['all_five_member_portraits_verified'] is False
          print('Source scout:', report['status'], 'frames:', report.get('frames_sampled', 0))
          PY
      - name: Upload research contact sheets (NO incomplete album PNGs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ITZY-whole-video-licensed-source-review-NO-CARDS
          path: output/full_lineup_video_scout/
          if-no-files-found: warn
          retention-days: 14
