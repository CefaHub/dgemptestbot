name: IVE Seattle 2026 WHOLE licensed shoot image inventory only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/research/ive_seattle_album_contact.py'
      - 'tools/research/ive_seattle_2026_full_album_inventory.json'
      - '.github/workflows/ive-seattle-full-shoot-source-scout.yml'
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install photo-inventory renderer only
        run: python -m pip install 'Pillow>=10,<13'
      - name: Inspect licensed whole-session photos; no game assets or cards
        run: |
          python tools/research/ive_seattle_album_contact.py --display-small-contact
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('output/ive_seattle_2026_source_inventory/AUDIT_REPORT.json').read_text())
          assert data['cards_created'] == 0
          assert data['game_catalog_modified'] is False
          assert data['full_group_members_approved'] == 0
          print('Research sheet only:', data['source_thumbnails_downloaded'], 'photos')
          PY
      - name: Upload whole 2026 Seattle source inventory (not gacha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IVE-SEATTLE-FULL-PHOTO-RESEARCH-NO-CARDS
          path: output/ive_seattle_2026_source_inventory/
          if-no-files-found: warn
          retention-days: 14
